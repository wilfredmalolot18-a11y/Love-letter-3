
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Love Letter ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>A Letter For You ❤️</h1>

        <p>Someone has a message for you...</p>

        <!-- Envelope -->
        <div class="envelope" id="envelope"
             onclick="openLetter()">

            <div class="flap"></div>

            <div class="letter">
                <h2>Dear Love ❤️</h2>

                <p>
                    You are one of the most special
                    people in my life.
                </p>

                <p>
                    Thank you for making my days
                    more meaningful.
                </p>

                <p>
                    I appreciate you always.
                    Never forget that you are special.
                </p>

                <h3>With Love ❤️</h3>
            </div>

            <div class="heart">❤️</div>

        </div>

        <button id="openButton" onclick="openLetter()">
            Open Letter 💌
        </button>

        <button id="closeButton" onclick="closeLetter()">
            Close Letter
        </button>

    </div>

    <script src="script.js"></script>

</body>
</html>
